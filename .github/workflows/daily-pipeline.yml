name: Daily pipeline and deploy

on:
  schedule:
    # 11:00 UTC ~= 5-6am Memphis time (Central), depending on daylight saving.
    - cron: "0 11 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Fetch Medtronic postings
        run: node scripts/run-medtronic.js
        continue-on-error: true # one broken scraper shouldn't block the rest of the pipeline

      - name: Classify and enrich
        run: node scripts/build-listings.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build site
        run: node scripts/build-site.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "Automated data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Check scraper health
        run: node scripts/check-scraper-health.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
