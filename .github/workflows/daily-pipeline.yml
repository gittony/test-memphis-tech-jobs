name: Daily pipeline and deploy

on:
  schedule:
    # 11:00 UTC ~= 5-6am Memphis time (Central), depending on daylight saving.
    - cron: "0 11 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # main now requires PR approval; the default GITHUB_TOKEN can't push
          # past that. This PAT belongs to an account with the "Repository
          # admin" bypass role, so the automated data commit below can still
          # go straight to main while everything else needs a reviewed PR.
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Fetch Workday employers
        id: fetch_workday
        run: node scripts/run-all-workday.js
        continue-on-error: true # one broken employer shouldn't block the rest of the pipeline
        timeout-minutes: 10 # backstop for a hung request outliving its own in-process timeout — see PLAN.md Slice 7

      - name: Fetch iCIMS employers
        id: fetch_icims
        run: node scripts/run-all-icims.js
        continue-on-error: true
        timeout-minutes: 10

      - name: Fetch Oracle Recruiting Cloud employers
        id: fetch_oracle
        run: node scripts/run-all-oracle-recruiting.js
        continue-on-error: true
        timeout-minutes: 10

      - name: Fetch UltiPro employers
        id: fetch_ultipro
        run: node scripts/run-all-ultipro.js
        continue-on-error: true
        timeout-minutes: 10

      - name: Record fetch step outcomes
        run: node scripts/record-step-outcomes.js
        env:
          FETCH_WORKDAY_OUTCOME: ${{ steps.fetch_workday.outcome }}
          FETCH_ICIMS_OUTCOME: ${{ steps.fetch_icims.outcome }}
          FETCH_ORACLE_OUTCOME: ${{ steps.fetch_oracle.outcome }}
          FETCH_ULTIPRO_OUTCOME: ${{ steps.fetch_ultipro.outcome }}

      - name: Classify and enrich
        run: node scripts/build-listings.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate job detail pages
        run: node scripts/build-job-pages.js

      - name: Build site
        run: node scripts/build-site.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/ site/job/
          git diff --staged --quiet || git commit -m "Automated data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Check scraper health
        run: node scripts/check-scraper-health.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
